<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">WicMail 系统链路</title>
  <desc id="desc">学生通过 Vue 前端和用户服务申请邮箱；外部邮件经 Cloudflare Email Routing、Email Worker 和邮件服务进入共享数据库。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5EE2A0"/></marker>
  </defs>

  <rect width="1200" height="470" rx="30" fill="#0B1511"/>
  <text x="64" y="74" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="46" font-weight="760" letter-spacing="-1.5">每个申请与每封邮件，都有明确去向</text>
  <text x="64" y="110" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.2">TWO SERVICES · ONE DATABASE · ONE CAMPUS DOMAIN</text>

  <g transform="translate(64 150)">
    <text y="20" fill="#C9A96E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">APPLICATION</text>
    <g transform="translate(0 34)">
      <rect width="174" height="62" rx="14" fill="#16241E" stroke="#385044"/>
      <text x="87" y="28" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">学生</text>
      <text x="87" y="49" text-anchor="middle" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">APPLY</text>
      <path d="M186 31H244" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="256" width="174" height="62" rx="14" fill="#16241E" stroke="#385044"/>
      <text x="343" y="28" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Vue 前端</text>
      <text x="343" y="49" text-anchor="middle" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">:3200</text>
      <path d="M442 31H500" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="512" width="210" height="62" rx="14" fill="#F5F2EA"/>
      <text x="617" y="28" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">backend-wic</text>
      <text x="617" y="49" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">FASTAPI :8001</text>
      <path d="M734 31H792" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="804" width="162" height="62" rx="14" fill="#1F3A2E" stroke="#5EE2A0"/>
      <text x="885" y="28" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">审核开通</text>
      <text x="885" y="49" text-anchor="middle" fill="#9EB1A7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">APPROVED</text>
    </g>
  </g>

  <path d="M64 248H1136" stroke="#263A31"/>

  <g transform="translate(64 286)">
    <text y="20" fill="#5EE2A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">INBOUND MAIL</text>
    <g transform="translate(0 34)">
      <rect width="150" height="70" rx="14" fill="#16241E" stroke="#385044"/>
      <text x="75" y="31" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">外部邮件</text>
      <text x="75" y="53" text-anchor="middle" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">@wic.edu.kg</text>
      <path d="M162 35H210" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="222" width="160" height="70" rx="14" fill="#16241E" stroke="#385044"/>
      <text x="302" y="31" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Cloudflare</text>
      <text x="302" y="53" text-anchor="middle" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">EMAIL ROUTING</text>
      <path d="M394 35H442" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="454" width="150" height="70" rx="14" fill="#16241E" stroke="#385044"/>
      <text x="529" y="31" text-anchor="middle" fill="#F5F2EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Worker</text>
      <text x="529" y="53" text-anchor="middle" fill="#8FA399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">AUTH · R2</text>
      <path d="M616 35H664" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="676" width="190" height="70" rx="14" fill="#F5F2EA"/>
      <text x="771" y="31" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">backend-mail</text>
      <text x="771" y="53" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">FASTAPI :8000</text>
      <path d="M878 35H918" stroke="#5EE2A0" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="930" width="106" height="70" rx="14" fill="#5EE2A0"/>
      <text x="983" y="31" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="800">MySQL</text>
      <text x="983" y="53" text-anchor="middle" fill="#1D3B2E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">SHARED</text>
    </g>
  </g>

  <text x="1136" y="432" text-anchor="end" fill="#60746A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">WICMAIL SYSTEM MAP</text>
</svg>
