<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">WicMail 本地启动路径</title>
  <desc id="desc">克隆项目、配置环境变量、启动两个后端与前端，然后在 3200 端口访问 WicMail。</desc>
  <rect width="1200" height="250" rx="30" fill="#F5F2EA"/>
  <path d="M132 146H1068" stroke="#CAD3CD" stroke-width="2"/>

  <g transform="translate(64 48)">
    <text fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="760" letter-spacing="-1">从代码到工作台，只需四步</text>
    <text y="34" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">LOCAL DEVELOPMENT PATH</text>
  </g>

  <g transform="translate(96 126)">
    <circle cx="36" cy="20" r="36" fill="#0B1511"/>
    <text x="36" y="28" text-anchor="middle" fill="#5EE2A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">01</text>
    <text x="36" y="81" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">克隆代码</text>
    <text x="36" y="105" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">git clone</text>
  </g>
  <g transform="translate(420 126)">
    <circle cx="36" cy="20" r="36" fill="#173126"/>
    <text x="36" y="28" text-anchor="middle" fill="#5EE2A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">02</text>
    <text x="36" y="81" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">配置环境</text>
    <text x="36" y="105" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">.env × 3</text>
  </g>
  <g transform="translate(744 126)">
    <circle cx="36" cy="20" r="36" fill="#173126"/>
    <text x="36" y="28" text-anchor="middle" fill="#5EE2A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">03</text>
    <text x="36" y="81" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">启动服务</text>
    <text x="36" y="105" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">8000 · 8001</text>
  </g>
  <g transform="translate(1068 126)">
    <circle cx="0" cy="20" r="36" fill="#5EE2A0"/>
    <text y="28" text-anchor="middle" fill="#0B1511" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">04</text>
    <text y="81" text-anchor="middle" fill="#0B1511" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">打开前端</text>
    <text y="105" text-anchor="middle" fill="#65746D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">localhost:3200</text>
  </g>
</svg>
